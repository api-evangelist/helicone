      tags:
      - Dataset
      security:
      - api_key: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewHeliconeDatasetParams'
      summary: Add helicone dataset
      x-summary-source: derived
  /v1/helicone-dataset/{datasetId}/mutate:
    post:
      operationId: MutateHeliconeDataset
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_null.string_'
      tags:
      - Dataset
      security:
      - api_key: []
      parameters:
      - in: path
        name: datasetId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MutateParams'
      summary: Mutate helicone dataset
      x-summary-source: derived
  /v1/helicone-dataset/{datasetId}/query:
    post:
      operationId: QueryHeliconeDatasetRows
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_HeliconeDatasetRow-Array.string_'
      tags:
      - Dataset
      security:
      - api_key: []
      parameters:
      - in: path
        name: datasetId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                limit:
                  type: number
                  format: double
                offset:
                  type: number
                  format: double
              required:
              - limit
              - offset
              type: object
      summary: Query helicone dataset rows
      x-summary-source: derived
  /v1/helicone-dataset/{datasetId}/count:
    post:
      operationId: CountHeliconeDatasetRows
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_number.string_'
      tags:
      - Dataset
      security:
      - api_key: []
      parameters:
