        name: datasetId
        required: true
        schema:
          type: string
      summary: Count helicone dataset rows
      x-summary-source: derived
  /v1/helicone-dataset/query:
    post:
      operationId: QueryHeliconeDataset
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_HeliconeDataset-Array.string_'
