      - Dataset
      security:
      - api_key: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                datasetIds:
                  items:
                    type: string
                  type: array
              type: object
      summary: Query helicone dataset
      x-summary-source: derived
  /v1/helicone-dataset/{datasetId}/request/{requestId}:
    post:
      operationId: UpdateHeliconeDatasetRequest
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ResultError_unknown_'
                - $ref: '#/components/schemas/ResultSuccess_any_'
      tags:
      - Dataset
      security:
      - api_key: []
      parameters:
      - in: path
        name: datasetId
        required: true
        schema:
          type: string
      - in: path
        name: requestId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                responseBody:
                  $ref: '#/components/schemas/Json'
                requestBody:
                  $ref: '#/components/schemas/Json'
              required:
              - responseBody
              - requestBody
              type: object
